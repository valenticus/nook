name: CI

# Runs when a release tag (v*) is pushed, and by hand from the Actions tab. Builds
# nothing that is published and uses no secrets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The TS UI test scripts use Node's native type stripping.
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - run: npm ci

      # The relay is bundled as a resource, so the app's build script wants it built first.
      - run: cargo build --release -p nook-hook

      - run: npx tsc --noEmit
      - run: npm run check:dev-previews
      - run: npm run test:frontend-output-isolation
      # This discovers and runs every tests/*.test.ts and tests/*.test.mjs
      # using fixture-only data; it does not require agents, credentials, or Nook.
      - run: npm run test:frontend

      - run: npm run build

      - run: npm run test:dev-build-artifact

      - run: cargo test --workspace

      - name: Test with Nook Dev feature
        run: cargo test --workspace --features nook-dev
        env:
          # Tauri consumes this as a JSON overlay, not a path. These identity
          # fields satisfy build.rs without weakening its isolation checks.
          TAURI_CONFIG: '{"productName":"Nook Dev","identifier":"io.github.zubairbinshaukat.nook.dev","mainBinaryName":"nook-dev"}'

      - name: Test with Nook Standalone feature
        run: cargo test --workspace --features nook-standalone
        env:
          TAURI_CONFIG: '{"productName":"Nook Personal Edition","identifier":"io.github.valenticus.nook","mainBinaryName":"nook-standalone"}'

      - name: npm audit (advisory)
        run: npm audit --fetch-retries=0 --fetch-timeout=30000
        continue-on-error: true

      - run: npm run tauri:build:dev

      - name: Check production and Dev frontend bundle isolation
        run: npm run test:frontend-output-isolation
        env:
          NOOK_PROD_DIST: dist
          NOOK_DEV_DIST: dist-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings
