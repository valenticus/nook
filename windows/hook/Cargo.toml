[package]
name = "nook-hook"
description = "Relays Claude Code hook events to Nook over a named pipe (Windows) or a Unix socket (Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["production-relay"]
production-relay = []
nook-dev-relay = []
standalone-relay = []

[[bin]]
name = "nook-hook"
path = "src/main.rs"
required-features = ["production-relay"]

[[bin]]
name = "nook-hook-dev"
path = "src/main.rs"
required-features = ["nook-dev-relay"]

[[bin]]
name = "nook-hook-standalone"
path = "src/main.rs"
required-features = ["standalone-relay"]

[[bin]]
name = "nook-dev-relay-test-server"
path = "src/bin/dev-relay-test-server.rs"
required-features = ["nook-dev-relay"]

[[test]]
name = "dev_relay"
path = "tests/dev_relay.rs"
required-features = ["nook-dev-relay"]

[dependencies]
serde_json = "1"

# Just enough Win32 to know our own SID, to check who is serving the pipe, and
# to name the processes above us (ToolHelp: the terminal or editor a session runs in).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
] }

# The relay's version information (name, description, author, version) as
# Windows shows it in a file's properties. The same crate tauri-build uses for
# the app, so nothing new is pulled in.
[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

# The socket syscalls and peer credentials the Linux transport needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
